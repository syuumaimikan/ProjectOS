[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
projectos-core = { version = "0.1.0", path = "../../../crates/projectos-core" }
projectos-db = { version = "0.1.0", path = "../../../crates/projectos-db" }
projectos-discovery = { version = "0.1.0", path = "../../../crates/projectos-discovery" }
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls"] }
tauri-plugin-dialog = "2.7.3"
chrono = { version = "0.4.45", features = ["serde"] }
projectos-runner = { version = "0.1.0", path = "../../../crates/projectos-runner" }
