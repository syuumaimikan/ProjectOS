[package]
name = "projectos-discovery"
version = "0.1.0"
edition = "2021"

[dependencies]
projectos-core = { path = "../projectos-core" }
tokio = { version = "1.0", features = ["full"] }
ignore = "0.4"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.10", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
