[package]
name = "projectos-db"
version = "0.1.0"
edition = "2021"

[dependencies]
projectos-core = { path = "../projectos-core" }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono", "uuid"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
chrono = "0.4.45"
uuid = "1.26.1"
